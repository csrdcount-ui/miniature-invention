# Uruchomienie na Render, plany DARMOWE (region Frankfurt, dane w UE).
# Darmowa baza Render wygasa po 30 dniach — wystarczy na prototyp.
# Darmowy serwer usypia się po ~15 min bezczynności.
# Każdy push na gałąź main automatycznie uruchamia wdrożenie (autoDeploy).
# PRZED PILOTAŻEM Z BROKEREM: serwer -> plan starter, baza -> basic-256mb.
databases:
  - name: platforma-brokerska-db
    plan: free
    region: frankfurt
    databaseName: broker
    user: broker
    postgresMajorVersion: "16"

services:
  - type: web
    name: platforma-brokerska
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /logowanie
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: platforma-brokerska-db
          property: connectionString
